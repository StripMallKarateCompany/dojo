Name = "dojo"
Description = "Dojo: signed packages, a Supervisor, and the Launcher as PID 1, growing into an operating system whose machines form a ring"
MasterBranch = "main"
BaseDir = "."
Domain = ""
UnityProject = ""
Namespace = ""
Owner = "smk"
TfStateStorageAccount = ""
SsmPrefix = ""
BaseDomain = ""
# The dev shell only: the tree keeps its own Makefile (which includes smk's checks), build scripts and VM
# tooling under support/.
Features = ["nixshell"]
BootstrapComplete = true
BootstrapOnly = ["/Cargo\\.toml$", "/src/main\\.rs$"]
# Patch-note labels are for games' release notes; Dojo has none.
Exclusions = ["/patch-labels\\.json$"]
Languages = ["Rust"]
[Ci]
Provider = ""
[Ci.Settings]
[Issue]
Provider = "workq"
# Dojo's own project, which the dojo and dojo-plans repositories share.
Project = "DOJ"
Label = "dojo"
Workspace = "smk"
[Format]
Exclude = [
  "vendor/**", "components/plan/vendor/**",
  # Languages smk has no formatter for.
  "**/*.fnl", "**/*.proto", "**/*.bats",
  # Test fixtures and package metadata: data, much of it exact bytes a test compares.
  "components/*/tests/**", "test/fixtures/**", "components/doj/static/**",
  "components/pkg-export-docker/defaults/**", "components/butterfly/bin/**", "components/sup/doc/**",
  # Code on its way out, which smk checks would only churn: the component plans' bash is being ported to Fennel.
  # The studio joins the checks in the next commit.
  "components/*/dojo/**", "components/studio/**",
  # Single files no formatter owns.
  "rust-toolchain", "VERSION",
  "support/vm/expected-failures", "support/vm/applets", "tools/bldr_toml_create/**",
]
# smk format and typecheck take the Rust, but smk lint does not yet: clippy finds some 2,760 problems in the
# inherited code. It joins when those are worked off (DOJ-31).
SkipLint = ["**/*.rs"]
[License]
Kind = "Apache-2.0"
Holder = "Strip Mall Karate Company"
Year = 2026
