[package]
name = "doj"
version = "0.0.0"
edition = "2024"
authors = []
build = "../build-dojo.rs"
workspace = "../../"

[[bin]]
name = "doj"
doc = false

[dependencies]
dirs = "7.0.0"
env_logger = "0.11.11"
dojo-sup-client = { path = "../sup-client" }
dojo-sup-protocol = { path = "../sup-protocol", default-features = false }
handlebars = "6.4.4"
libc = "0.2.191"
log = "0.4"
pbr = "1.1.1"
serde = "1.0.229"
serde_json = "1.0.154"
serde_derive = "1.0.229"
tabwriter = "1.1.0"
termcolor = "1.0.4"
toml = "1.1.8"
url = "2.5.8"
walkdir = "2.2.7"
tar = "0.4.46"
flate2 = "1.0.7"
chrono = "0.4.6"

[dependencies.clap]
version = "4.6.7"
features = ["env", "string"]

[dependencies.clap_complete]
version = "4.6.11"

[dependencies.dojo_core]
path = "../core"

[dependencies.dojo_common]
path = "../common"

[dependencies.dojo_api_client]
path = "../builder-api-client"

[dependencies.dojo_http_client]
path = "../http-client"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
functional = []
