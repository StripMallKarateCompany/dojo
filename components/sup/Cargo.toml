[package]
name = "dojo_sup"
version = "0.0.0"
edition = "2024"
authors = []
build = "./build.rs"
workspace = "../../"

[lib]
name = "dojo_sup"

[[bin]]
name = "doj-sup"
path = "src/main.rs"
doc = false

[[bin]]
name = "subscriber"
path = "src/subscriber.rs"
doc = false

[dependencies]
async-nats = "0.51.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["env", "string"] }
cpu-time = "1.0.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
glob = "0.3.0"
doj = { path = "../doj" }
dojo_butterfly = { path = "../butterfly", default-features = false }
dojo_common = { path = "../common" }
dojo_core = { path = "../core" }
dojo_api_client = { path = "../builder-api-client" }
dojo-launcher-client = { path = "../launcher-client" }
dojo-sup-protocol = { path = "../sup-protocol", default-features = false }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
libc = "0.2.191"
log = "0.4"
notify = "4.0.10"
num_cpus = "1.10.0"
prometheus = "0.14.0"
prost = "0.14.4"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde = { version = "1.0.229", features = ["rc"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
termcolor = "1.0.4"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
toml = "1.1.8"

[target.'cfg(target_family = "unix")'.dependencies]
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }

[dev-dependencies]
dojo-sup-client = { path = "../sup-client" }
jsonschema = { version = "0.60.2", default-features = false }
rand = "0.10.3"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies.dojo_core]
path = "../core"

[features]
default = []
apidocs = []
ignore_inconsistent_tests = []
ignore_integration_tests = []
