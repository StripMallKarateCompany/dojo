[package]
name = "dojo-sup-protocol"
version = "0.0.0"
edition = "2024"
authors = []
build = "./build.rs"
workspace = "../../"

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
dojo_core = { path = "../core" }
log = "0.4"
prost = "0.14.4"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
serde = "1.0.229"
serde_derive = "1.0.229"
tokio-util = { version = "0.7.20", features = ["codec"] }

[build-dependencies]
heck = "0.5.0"
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.8"

[features]
default = ["protocols"]
protocols = []
