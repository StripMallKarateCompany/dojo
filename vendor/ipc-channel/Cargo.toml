[package]
name = "ipc-channel"
version = "0.9.0"
edition = "2024"
description = "A multiprocess drop-in replacement for Rust channels"
authors = ["The Servo Project Developers"]
license = "MIT/Apache-2.0"
repository = "https://github.com/servo/ipc-channel"

[features]
force-inprocess = []
unstable = []
async = ["futures"]
win32-trace = []

[dependencies]
bincode = "0.9"
lazy_static = "0.2"
libc = "0.2.12"
rand = "0.3"
serde = { version="1.0", features=["rc"] }
uuid = {version = "0.5", features = ["v4"]}
fnv = "1.0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
mio = "0.6.1"

futures = { version = "0.1", optional = true }

# The bench uses #![feature(test)], which only a nightly compiler builds; without this,
# cargo check --all-targets fails on the tree's stable Rust.
[[bench]]
name = "bench"
required-features = ["unstable"]

[dev-dependencies]
crossbeam = "0.2"
